name: Kerää kertoimet

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: keraa
  cancel-in-progress: false

jobs:
  keraa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Hae kertoimet
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python kerroin_keraaja.py
      - name: Tallenna muutokset
        run: |
          git config user.name "kerroin-bot"
          git config user.email "kerroin-bot@users.noreply.github.com"
          git add kertoimet.csv haut_loki.csv || true
          if git diff --cached --quiet; then
            echo "Ei muutoksia"
          else
            git commit -m "Kertoimet $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
